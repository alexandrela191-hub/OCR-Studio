<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">OCR Studio architecture overview</title>
  <desc id="desc">A clean visual overview of the OCR Studio pipeline.</desc>
  <rect width="1200" height="680" fill="#0f172a"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="36" font-weight="700">OCR Studio 43.17.73</text>
  <text x="70" y="116" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="20">Пакетное распознавание документов и контроль качества</text>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(70 185)"><rect width="230" height="130" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="24" y="45" fill="#7dd3fc" font-size="18" font-weight="700">1 · Входные данные</text><text x="24" y="78" fill="#e2e8f0" font-size="18">PDF / изображения</text><text x="24" y="105" fill="#94a3b8" font-size="15">пакет документов</text></g>
    <g transform="translate(360 185)"><rect width="230" height="130" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="24" y="45" fill="#c4b5fd" font-size="18" font-weight="700">2 · OCR-движок</text><text x="24" y="78" fill="#e2e8f0" font-size="18">Tesseract + OpenCV</text><text x="24" y="105" fill="#94a3b8" font-size="15">ROI и шаблоны</text></g>
    <g transform="translate(650 185)"><rect width="230" height="130" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="2"/><text x="24" y="45" fill="#6ee7b7" font-size="18" font-weight="700">3 · Контроль</text><text x="24" y="78" fill="#e2e8f0" font-size="18">очередь проверки</text><text x="24" y="105" fill="#94a3b8" font-size="15">обучение шаблонов</text></g>
    <g transform="translate(940 185)"><rect width="190" height="130" rx="18" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text x="24" y="45" fill="#fde68a" font-size="18" font-weight="700">4 · Результат</text><text x="24" y="78" fill="#e2e8f0" font-size="18">данные / Excel</text><text x="24" y="105" fill="#94a3b8" font-size="15">локальная статистика</text></g>
    <path d="M300 250h60M590 250h60M880 250h60" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="70" y="400" width="1060" height="150" rx="20" fill="#111827" stroke="#334155"/>
    <text x="105" y="450" fill="#f8fafc" font-size="21" font-weight="700">Инженерные акценты</text>
    <text x="105" y="490" fill="#cbd5e1" font-size="18">Фоновый worker · кэширование · повторные попытки · Selenium/CDP · безопасные локальные данные</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
</svg>
